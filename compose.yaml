services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      POSTGRES_DB: ${APEX_POSTGRES_DB:-apex}
      POSTGRES_USER: ${APEX_POSTGRES_USER:-apex}
      POSTGRES_PASSWORD: ${APEX_POSTGRES_PASSWORD:-apex_local_only}
    ports:
      - "${APEX_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - apex-postgres-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G

volumes:
  apex-postgres-data:
