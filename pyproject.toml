[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "apex-golden-slice"
version = "0.1.0"
description = "Offline deterministic Apex golden-path simulation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cryptography>=50,<51",
  "fastapi>=0.115,<1",
  "flask==3.1.3",
  "flask-cors==6.0.1",
  "gunicorn==23.0.0",
  "mlflow-skinny==3.14.0",
  "optuna==4.9.0",
  "pandas-market-calendars==5.2.0",
  "pydantic>=2.10,<3",
  "scikit-learn==1.6.1",
  "uvicorn>=0.34,<1",
  "vectorbt==1.1.0",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.120,<7",
  "mypy>=1.14,<2",
  "pytest==9.0.3",
  "ruff>=0.9,<1",
]
persistence = [
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
]

[project.scripts]
apex = "apex.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/apex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers -m 'not postgres'"
markers = [
  "postgres: requires the local PostgreSQL persistence service",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts/dev.py"]
mypy_path = "src"

[tool.coverage.run]
branch = true
source = ["apex"]
